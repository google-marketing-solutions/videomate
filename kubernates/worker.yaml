apiVersion: apps/v1
kind: Deployment
metadata:
  name: vv-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vv-worker
  template:
    metadata:
      labels:
        app: vv-worker
    spec:
      containers:
      - name: vv-worker
        image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_IMAGE_REPOSITORY_NAME/vv-worker:TAG
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "2000m"
            memory: "3.5Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"