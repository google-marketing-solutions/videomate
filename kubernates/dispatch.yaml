apiVersion: apps/v1
kind: Deployment
metadata:
  name: vv-dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vv-dispatch
  template:
    metadata:
      labels:
        app: vv-dispatch
    spec:
      containers:
      - image: $LABEL_SERVER_IMAGE
        name: label-server
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vv-dispatch
  annotations:
    # Provision as a regional internal L4 LoadBalancer reachable only within
    # the VPC, not from the public internet. Front with Ingress + IAP if
    # external authenticated access is required.
    networking.gke.io/load-balancer-type: "Internal"
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: vv-dispatch
  type: LoadBalancer